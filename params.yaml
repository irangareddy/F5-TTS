# F5-TTS Configuration Parameters
# This file contains all training, inference, and Docker settings for F5-TTS

training:
  # Model architecture: F5TTS_v1_Base | F5TTS_Base | E2TTS_Base
  exp_name: F5TTS_v1_Base

  # Dataset name - determines data directory and checkpoint output directory
  dataset_name: voxe_data_v2

  # Training hyperparameters
  learning_rate: 1e-4
  batch_size_per_gpu: 170  # Reduced from 190 for stability and OOM prevention
  batch_size_type: frame  # frame | sample
  max_samples: 26  # Reduced from 32 for cleaner batches with fewer long sequences
  grad_accumulation_steps: 2  # Increased from 1 to restore effective batch size after reductions
  max_grad_norm: 0.5  # Reduced from 1.0 to prevent gradient spikes and emotion collapse

  # Training schedule (50 epochs with 10 patience for voxe_data_v2)
  epochs: 1  # Testing with 1 epoch first
  num_warmup_updates: 1500  # Increased from 500 for stable emotion learning early
  save_per_updates: 2000  # Increased from 500 to reduce I/O overhead
  keep_last_n_checkpoints: 5  # Increased from 2 for better rollback (emotion improves late)
  last_per_updates: 8000  # Increased from 2000 to spread final snapshots across training

  # Validation and Early Stopping
  validation_split: data/voxe_data_v2/manifests/val.jsonl
  validation_interval: 1  # Validate every N epochs
  early_stopping_patience: 10  # 10 patience for voxe_data_v2 fine-tuning
  early_stopping_threshold: 0.0005  # Decreased from 0.001 to catch subtle improvements

  # Fine-tuning options
  finetune: true
  pretrain: null  # Path to custom pretrained checkpoint (null uses default from HuggingFace)

  # Tokenizer settings
  tokenizer: char  # pinyin | char | custom
  tokenizer_path: null  # Path to custom vocab.txt (only used if tokenizer = 'custom')

  # Data loading
  num_workers: 16  # Number of data loading workers (32 CPU cores on RTX 4090 machine)

  # Logging
  log_samples: false  # Disabled to reduce I/O overhead (~2-3 min saved per checkpoint)
  logger: wandb  # null | wandb | tensorboard
  bnb_optimizer: false  # Use 8-bit Adam optimizer

inference:
  # Model settings
  model: F5TTS_v1_Base
  model_cfg: null  # Path to model config YAML (optional)

  # Checkpoint and vocab
  ckpt_file: ckpts/F5TTS_v1_Base_voxe_data_v2_manifest/model_best.pt
  vocab_file: data/voxe_char/vocab.txt

  # Reference audio and text
  ref_audio: data/voxe_data_v2/wav24k/esd/0011/Neutral/0011_000001.wav
  ref_text: "the nine the eggs, i keep."
  
  # Generation settings
  gen_text: "This is a test of the fine-tuned F5-TTS model on the VOXE dataset."
  gen_file: ""  # File with text to generate (ignores gen_text if set)
  
  # Output settings
  output_dir: tests
  output_file: voxe_test.wav
  save_chunk: false
  remove_silence: false
  
  # Vocoder settings
  load_vocoder_from_local: false
  vocoder_name: vocos  # vocos | bigvgan
  target_rms: null  # null uses default
  cross_fade_duration: null  # null uses default
  nfe_step: 32  # Standard CFM denoising steps for consistent quality
  speed: 1.0  # Neutral tempo (emotion ≠ speed)
  sway_sampling_coef: 0.4  # Smooth prosody, prevent jitter across emotions
  cfg_strength: 1.2  # Sharpen articulation without losing emotion
  fix_duration: null  # null uses default

wandb:
  # Weights & Biases configuration
  enabled: true
  project: voxe-tts
  entity: rr-sjsu
  name: voxe_data_v2_finetune_rtx4090_50epochs
  tags:
    - voxe-data-v2
    - fine-tune
    - rtx4090
    - 15080-samples
    - full-dataset
    - 50-epochs
    - 10-patience
  notes: "voxe_data_v2 dataset fine-tuning (15,080 training samples, 50 epochs, 10 patience)"
  save_code: true
  log_frequency: 50  # Increased from 10 to reduce logging overhead

docker:
  # Docker image settings
  image: f5-tts:latest
  container_name: f5-tts-jupyter

  # GPU and resource settings
  gpus: all
  shm_size: 64g  # Increased from 2g for large batch DataLoader queues

  # Working directory inside container
  workdir: /workspace/F5-TTS
  
  # Port mappings
  jupyter_port: 8888

paths:
  # Local paths (relative to project root)
  data: data
  ckpts: ckpts
  src: src
  notebooks: notebooks
  tests: tests
  
  # Container paths (inside Docker)
  container_data: /workspace/F5-TTS/data
  container_ckpts: /workspace/F5-TTS/ckpts
  container_src: /workspace/F5-TTS/src
  container_notebooks: /workspace/F5-TTS/notebooks
  container_tests: /workspace/F5-TTS/tests

