# F5-TTS Configuration Parameters - Emotion-Focused Fine-Tuning
# This file contains all training, inference, and Docker settings for F5-TTS
# Emotion-focused config: lower LR, more grad accumulation, softer clipping, emotion-oversampled batches.

training:
  # Model architecture: F5TTS_v1_Base | F5TTS_Base | E2TTS_Base
  exp_name: F5TTS_v1_Base_emotion_focus

  # Dataset name - determines data directory and checkpoint output directory
  dataset_name: voxe_data_v2  # same manifests, but sampler oversamples ESD+RAVDESS 2–3x

  # Core optimization
  learning_rate: 5e-5  # Lower LR for more stable emotion learning
  batch_size_per_gpu: 128  # Smaller per-GPU batch with more grad-accum
  batch_size_type: frame  # frame | sample
  max_samples: 32  # Emotion-denser batches
  grad_accumulation_steps: 3  # More grad accumulation for effective batch size
  max_grad_norm: 1.0  # Softer clipping

  # Schedule
  epochs: 60  # Same epochs but emotion-denser batches
  num_warmup_updates: 2500  # Increased warmup for stable emotion learning
  save_per_updates: 2000  # Same as current config
  keep_last_n_checkpoints: 5  # Same as current config
  last_per_updates: 8000  # Same as current config

  # Validation / early stopping
  validation_split: data/outputs/full/manifests/val.jsonl
  validation_interval: 1  # Validate every N epochs
  early_stopping_patience: 8  # Reduced from 10 for emotion-focused training
  early_stopping_threshold: 0.0007  # Slightly higher threshold

  # Fine-tuning
  finetune: true
  pretrain: null  # Path to custom pretrained checkpoint (null uses default from HuggingFace)

  # Tokenizer
  tokenizer: char  # pinyin | char | custom
  tokenizer_path: null  # Path to custom vocab.txt (only used if tokenizer = 'custom')

  # Data loading
  num_workers: 16  # Number of data loading workers

  # Logging
  log_samples: false  # Disabled to reduce I/O overhead
  logger: wandb  # null | wandb | tensorboard
  bnb_optimizer: false  # Use 8-bit Adam optimizer

inference:
  # Model settings
  model: F5TTS_v1_Base
  model_cfg: null  # Path to model config YAML (optional)

  # Checkpoint and vocab
  ckpt_file: ckpts/F5TTS_v1_Base_emotion_focus/model_best.pt
  vocab_file: data/voxe_char/vocab.txt

  # Reference audio and text
  ref_audio: data/outputs/full/wav24k/esd/0011/Neutral/0011_000001.wav
  ref_text: "the nine the eggs, i keep."
  
  # Generation settings
  gen_text: "This is a test of the emotion-focused F5-TTS fine-tune."
  gen_file: ""  # File with text to generate (ignores gen_text if set)
  
  # Output settings
  output_dir: tests
  output_file: voxe_test_emotion_focus.wav
  save_chunk: false
  remove_silence: false
  
  # Vocoder settings
  load_vocoder_from_local: false
  vocoder_name: vocos  # vocos | bigvgan
  target_rms: null  # null uses default
  cross_fade_duration: null  # null uses default
  nfe_step: 32  # Standard CFM denoising steps for consistent quality
  speed: 1.0  # Neutral tempo
  sway_sampling_coef: 0.5  # Slightly higher than 0.4 for more expressive prosody
  cfg_strength: 1.3  # A bit stronger conditioning
  fix_duration: null  # null uses default

wandb:
  # Weights & Biases configuration
  enabled: true
  project: voxe-tts
  entity: rr-sjsu
  name: voxe_data_v2_f5tts_v1_base_emotion_focus
  tags:
    - voxe-data-v2
    - f5tts-v1-base
    - fine-tuning
    - emotional-tts
    - emotion-focus
    - rtx4090
  notes: |
    Emotion-focused config: lower LR, more grad accumulation, softer clipping, emotion-oversampled batches.
  save_code: true
  log_frequency: 50  # Log every 50 updates to reduce overhead

docker:
  # Docker image settings
  image: f5-tts:latest
  container_name: f5-tts-jupyter

  # GPU and resource settings
  gpus: all
  shm_size: 64g  # Increased from 2g for large batch DataLoader queues

  # Working directory inside container
  workdir: /workspace/F5-TTS
  
  # Port mappings
  jupyter_port: 8888

paths:
  # Local paths (relative to project root)
  data: data
  ckpts: ckpts
  src: src
  notebooks: notebooks
  tests: tests
  
  # Container paths (inside Docker)
  container_data: /workspace/F5-TTS/data
  container_ckpts: /workspace/F5-TTS/ckpts
  container_src: /workspace/F5-TTS/src
  container_notebooks: /workspace/F5-TTS/notebooks
  container_tests: /workspace/F5-TTS/tests

